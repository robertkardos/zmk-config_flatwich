# Split Keyboard Settings
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# RGBLED Widget Settings
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
CONFIG_RGBLED_WIDGET_CONN_SHOW_USB=y
CONFIG_RGBLED_WIDGET=y

CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=1000
CONFIG_RGBLED_WIDGET_INTERVAL_MS=300

# White (7)
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=6
# Magenta (5)
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=5
# Cyan (6)
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=7
